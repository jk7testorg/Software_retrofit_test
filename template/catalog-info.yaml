apiVersion: backstage.io/v1alpha1
kind: Component

metadata:
  name: ${{values.app_name}}
  description: Service ${{values.app_name}}

  annotations:
    github.com/project-slug: jk7testorg/${{values.app_name}}
    backstage.io/techdocs-ref: dir:.
    jenkins.io/job-full-name: jk7test/${{values.app_name}}/main
    argocd/app-name: ${{ values.app_name | lower }}
    backstage.io/kubernetes-id: ${{values.app_name}}
    backstage.io/kubernetes-namespace: default
    sonarqube.org/project-key: ${{ values.app_name | lower }}

spec:
  type: service
  owner: development
  lifecycle: experimental
